viewer:
  eye: !!python/tuple
  - 2.8
  - -0.5
  - 0.7
  lookat: !!python/tuple
  - 0.0
  - 0.0
  - 0.0
  cam_prim_path: /OmniverseKit_Persp
  resolution: !!python/tuple
  - 1280
  - 720
  origin_type: asset_root
  env_index: 0
  asset_name: robot
  body_name: null
sim:
  device: cuda:0
  dt: 0.005
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
  physics_prim_path: /physicsScene
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 1.0
    dynamic_friction: 1.0
    restitution: 0.0
    compliant_contact_stiffness: null
    compliant_contact_damping: null
    friction_combine_mode: multiply
    restitution_combine_mode: multiply
    _usd_applied_schema: PhysxMaterialAPI
    _usd_field_exceptions: {}
    _usd_namespace: physxMaterial
  use_fabric: true
  render_interval: 4
  enable_scene_query_support: false
  use_newton_actuators: false
  physics:
    class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
    num_substeps: 1
    debug_mode: false
    use_cuda_graph: true
    solver_cfg:
      class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
      solver_type: mujoco_warp
      njmax: 512
      nconmax: 100
      iterations: 100
      ls_iterations: 50
      solver: newton
      integrator: implicitfast
      use_mujoco_cpu: false
      disable_contacts: false
      default_actuator_gear: null
      actuator_gears: null
      update_data_interval: 1
      save_to_mjcf: null
      impratio: 1
      cone: pyramidal
      ccd_iterations: 35
      ls_parallel: false
      use_mujoco_contacts: false
      tolerance: 1.0e-06
    collision_cfg:
      broad_phase: explicit
      reduce_contacts: true
      rigid_contact_max: null
      max_triangle_pairs: 2500000
      soft_contact_max: null
      soft_contact_margin: 0.01
      requires_grad: null
      sdf_hydroelastic_config: null
    default_shape_cfg:
      margin: 0.0
      gap: 0.01
  render:
    enable_translucency: null
    enable_reflections: null
    enable_global_illumination: null
    antialiasing_mode: null
    enable_dlssg: null
    enable_dl_denoiser: null
    dlss_mode: null
    enable_direct_lighting: null
    samples_per_pixel: null
    enable_shadows: null
    enable_ambient_occlusion: null
    dome_light_upper_lower_strategy: null
    max_bounces: null
    split_glass: null
    split_clearcoat: null
    split_rough_reflection: null
    ambient_light_intensity: null
    ambient_occlusion_denoiser_mode: null
    view_tile_limit: null
    carb_settings: null
    rendering_mode: null
  create_stage_in_memory: false
  logging_level: WARNING
  save_logs_to_file: true
  log_dir: null
  visualizer_cfgs: []
ui_window_class_type: isaaclab.envs.ui.manager_based_rl_env_window:ManagerBasedRLEnvWindow
seed: 42
decimation: 4
scene:
  num_envs: 4096
  env_spacing: 2.5
  lazy_sensor_update: true
  replicate_physics: true
  filter_collisions: true
  clone_in_fabric: false
  terrain:
    class_type: isaaclab.terrains.terrain_importer:TerrainImporter
    collision_group: -1
    prim_path: /World/ground
    num_envs: 4096
    terrain_type: plane
    terrain_generator: null
    usd_path: null
    env_spacing: 2.5
    use_terrain_origins: true
    visual_material:
      func: isaaclab.sim.spawners.materials.visual_materials:spawn_preview_surface
      diffuse_color: !!python/tuple
      - 0.2
      - 0.2
      - 0.2
      emissive_color: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      roughness: 0.5
      metallic: 0.0
      opacity: 1.0
    physics_material:
      func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
      static_friction: 1.0
      dynamic_friction: 1.0
      restitution: 0.0
      compliant_contact_stiffness: null
      compliant_contact_damping: null
      friction_combine_mode: multiply
      restitution_combine_mode: multiply
      _usd_applied_schema: PhysxMaterialAPI
      _usd_field_exceptions: {}
      _usd_namespace: physxMaterial
    max_init_terrain_level: null
    debug_vis: false
  sky_light:
    class_type: null
    prim_path: /World/skyLight
    spawn:
      func: isaaclab.sim.spawners.lights.lights:spawn_light
      visible: true
      semantic_tags: null
      copy_from_source: true
      spawn_path: /World/skyLight
      prim_type: DomeLight
      color: !!python/tuple
      - 1.0
      - 1.0
      - 1.0
      enable_color_temperature: false
      color_temperature: 6500.0
      normalize: false
      exposure: 0.0
      intensity: 750.0
      texture_file: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/Materials/Textures/Skies/PolyHaven/kloofendal_43d_clear_puresky_4k.hdr
      texture_format: automatic
      visible_in_primary_ray: true
    init_state:
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      rot: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    collision_group: 0
    debug_vis: false
    disable_shape_checks: null
  robot:
    class_type: isaaclab.assets.articulation.articulation:Articulation
    prim_path: /World/envs/env_.*/Robot
    spawn:
      asset_path: /workspace/isaaclab/external/robot_description/vendor/rpo_description/urdf/rpo.urdf
      usd_dir: /workspace/isaaclab/external/robot_description/build/roboparty_rpo
      usd_file_name: null
      force_usd_conversion: false
      make_instanceable: true
      fix_base: false
      root_link_name: null
      link_density: 0.0
      merge_fixed_joints: true
      convert_mimic_joints_to_normal_joints: false
      joint_drive:
        drive_type: force
        target_type: position
        gains:
          stiffness: 0
          damping: 0
      collision_from_visuals: false
      collision_type: Convex Hull
      self_collision: true
      replace_cylinders_with_capsules: true
      merge_mesh: false
      ros_package_paths: []
      robot_type: Humanoid
      run_asset_transformer: true
      run_multi_physics_conversion: true
      debug_mode: false
      func: robot_description.robots.urdf_spawn:spawn_urdf_inertia_fixed
      visible: true
      semantic_tags: null
      copy_from_source: true
      spawn_path: /World/envs/env_0/Robot
      mass_props: null
      deformable_props: null
      rigid_props:
        rigid_body_enabled: null
        kinematic_enabled: null
        disable_gravity: false
        linear_damping: 0.0
        angular_damping: 0.0
        max_linear_velocity: 1000.0
        max_angular_velocity: 1000.0
        max_depenetration_velocity: 1.0
        max_contact_impulse: null
        enable_gyroscopic_forces: null
        retain_accelerations: false
        solver_position_iteration_count: null
        solver_velocity_iteration_count: null
        sleep_threshold: null
        stabilization_threshold: null
        _usd_applied_schema: PhysxRigidBodyAPI
        _usd_field_exceptions:
          PhysxRigidBodyAPI: !!python/tuple
          - physxRigidBody
          - - disable_gravity
        _usd_namespace: physxRigidBody
      collision_props: null
      activate_contact_sensors: true
      scale: null
      articulation_props:
        articulation_enabled: null
        fix_root_link: null
        enabled_self_collisions: true
        solver_position_iteration_count: 8
        solver_velocity_iteration_count: 4
        sleep_threshold: null
        stabilization_threshold: null
        _usd_applied_schema: PhysxArticulationAPI
        _usd_field_exceptions:
          PhysxArticulationAPI: !!python/tuple
          - physxArticulation
          - - articulation_enabled
        _usd_namespace: physxArticulation
      fixed_tendons_props: null
      spatial_tendons_props: null
      joint_drive_props:
        drive_type: null
        max_force: null
        max_effort: null
        stiffness: null
        damping: null
        ensure_drives_exist: true
        max_joint_velocity: null
        max_velocity: null
        _usd_applied_schema: null
        _usd_field_exceptions:
          PhysxJointAPI: !!python/tuple
          - physxJoint
          - - max_joint_velocity
        _usd_namespace: null
      visual_material_path: material
      visual_material: null
      physics_material_path: material
      physics_material: null
      fix_principal_axes: true
      physics_variant: physics
    init_state:
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 0.75
      rot: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      - 1.0
      lin_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      ang_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      joint_pos:
        left_thigh_pitch_joint: -0.1
        left_knee_joint: 0.3
        left_ankle_pitch_joint: -0.2
        left_arm_pitch_joint: 0.18
        left_arm_roll_joint: 0.06
        left_elbow_pitch_joint: 0.78
        right_thigh_pitch_joint: -0.1
        right_knee_joint: 0.3
        right_ankle_pitch_joint: -0.2
        right_arm_pitch_joint: 0.18
        right_arm_roll_joint: -0.06
        right_elbow_pitch_joint: 0.78
      joint_vel:
        .*: 0.0
    collision_group: 0
    debug_vis: false
    disable_shape_checks: null
    articulation_root_prim_path: null
    soft_joint_pos_limit_factor: 0.9
    actuators:
      legs:
        class_type: isaaclab.actuators.actuator_pd:DelayedPDActuator
        joint_names_expr:
        - .*_thigh_yaw_joint
        - .*_thigh_roll_joint
        - .*_thigh_pitch_joint
        - .*_knee_joint
        - torso_joint
        effort_limit:
          .*_thigh_yaw_joint: 120.0
          .*_thigh_roll_joint: 120.0
          .*_thigh_pitch_joint: 120.0
          .*_knee_joint: 120.0
          torso_joint: 120.0
        velocity_limit:
          .*_thigh_yaw_joint: 25.0
          .*_thigh_roll_joint: 25.0
          .*_thigh_pitch_joint: 25.0
          .*_knee_joint: 25.0
          torso_joint: 25.0
        effort_limit_sim:
          .*_thigh_yaw_joint: 120.0
          .*_thigh_roll_joint: 120.0
          .*_thigh_pitch_joint: 120.0
          .*_knee_joint: 120.0
          torso_joint: 120.0
        velocity_limit_sim:
          .*_thigh_yaw_joint: 25.0
          .*_thigh_roll_joint: 25.0
          .*_thigh_pitch_joint: 25.0
          .*_knee_joint: 25.0
          torso_joint: 25.0
        stiffness:
          .*_thigh_yaw_joint: 100.0
          .*_thigh_roll_joint: 100.0
          .*_thigh_pitch_joint: 100.0
          .*_knee_joint: 150.0
          torso_joint: 150.0
        damping:
          .*_thigh_yaw_joint: 3.3
          .*_thigh_roll_joint: 3.3
          .*_thigh_pitch_joint: 3.3
          .*_knee_joint: 5.0
          torso_joint: 5.0
        armature:
          .*_thigh_yaw_joint: 0.01
          .*_thigh_roll_joint: 0.01
          .*_thigh_pitch_joint: 0.01
          .*_knee_joint: 0.01
          torso_joint: 0.01
        friction: null
        dynamic_friction: null
        viscous_friction: null
        min_delay: 0
        max_delay: 2
      feet:
        class_type: isaaclab.actuators.actuator_pd:DelayedPDActuator
        joint_names_expr:
        - .*_ankle_pitch_joint
        - .*_ankle_roll_joint
        effort_limit:
          .*_ankle_pitch_joint: 27.0
          .*_ankle_roll_joint: 27.0
        velocity_limit:
          .*_ankle_pitch_joint: 8.0
          .*_ankle_roll_joint: 8.0
        effort_limit_sim:
          .*_ankle_pitch_joint: 27.0
          .*_ankle_roll_joint: 27.0
        velocity_limit_sim:
          .*_ankle_pitch_joint: 8.0
          .*_ankle_roll_joint: 8.0
        stiffness:
          .*_ankle_pitch_joint: 40.0
          .*_ankle_roll_joint: 40.0
        damping:
          .*_ankle_pitch_joint: 2.0
          .*_ankle_roll_joint: 2.0
        armature:
          .*_ankle_pitch_joint: 0.01
          .*_ankle_roll_joint: 0.01
        friction: null
        dynamic_friction: null
        viscous_friction: null
        min_delay: 0
        max_delay: 2
      shoulders:
        class_type: isaaclab.actuators.actuator_pd:DelayedPDActuator
        joint_names_expr:
        - .*_arm_pitch_joint
        - .*_arm_roll_joint
        - .*_arm_yaw_joint
        effort_limit:
          .*_arm_pitch_joint: 27.0
          .*_arm_roll_joint: 27.0
          .*_arm_yaw_joint: 27.0
        velocity_limit:
          .*_arm_pitch_joint: 8.0
          .*_arm_roll_joint: 8.0
          .*_arm_yaw_joint: 8.0
        effort_limit_sim:
          .*_arm_pitch_joint: 27.0
          .*_arm_roll_joint: 27.0
          .*_arm_yaw_joint: 27.0
        velocity_limit_sim:
          .*_arm_pitch_joint: 8.0
          .*_arm_roll_joint: 8.0
          .*_arm_yaw_joint: 8.0
        stiffness:
          .*_arm_pitch_joint: 40.0
          .*_arm_roll_joint: 40.0
          .*_arm_yaw_joint: 40.0
        damping:
          .*_arm_pitch_joint: 2.0
          .*_arm_roll_joint: 2.0
          .*_arm_yaw_joint: 2.0
        armature:
          .*_arm_pitch_joint: 0.01
          .*_arm_roll_joint: 0.01
          .*_arm_yaw_joint: 0.01
        friction: null
        dynamic_friction: null
        viscous_friction: null
        min_delay: 0
        max_delay: 2
      arms:
        class_type: isaaclab.actuators.actuator_pd:DelayedPDActuator
        joint_names_expr:
        - .*_elbow_pitch_joint
        - .*_elbow_yaw_joint
        effort_limit:
          .*_elbow_pitch_joint: 27.0
          .*_elbow_yaw_joint: 27.0
        velocity_limit:
          .*_elbow_pitch_joint: 8.0
          .*_elbow_yaw_joint: 8.0
        effort_limit_sim:
          .*_elbow_pitch_joint: 27.0
          .*_elbow_yaw_joint: 27.0
        velocity_limit_sim:
          .*_elbow_pitch_joint: 8.0
          .*_elbow_yaw_joint: 8.0
        stiffness:
          .*_elbow_pitch_joint: 30.0
          .*_elbow_yaw_joint: 20.0
        damping:
          .*_elbow_pitch_joint: 1.5
          .*_elbow_yaw_joint: 1.0
        armature:
          .*_elbow_pitch_joint: 0.01
          .*_elbow_yaw_joint: 0.01
        friction: null
        dynamic_friction: null
        viscous_friction: null
        min_delay: 0
        max_delay: 2
    actuator_value_resolution_debug_print: false
  rpo_feet:
    class_type: isaaclab.sensors.contact_sensor.contact_sensor:ContactSensor
    prim_path: /World/envs/env_.*/Robot/.*_ankle_roll_link
    update_period: 0.005
    debug_vis: false
    track_pose: false
    track_contact_points: false
    track_friction_forces: false
    max_contact_data_count_per_prim: null
    track_air_time: true
    force_threshold: 1.0
    history_length: 1
    filter_prim_paths_expr: []
